<!DOCTYPE html>

] } } } }</script></head><body class="bg-surface text-on-surface font-body-md text-body-md antialiased flex flex-col min-h-screen selection:bg-secondary-container selection:text-primary"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe px-margin bg-surface justify-center"><div class="flex flex-col w-full pb-8">
<!-- Brand Header Section -->
<div class="flex flex-col items-center text-center px-2 pt-2 pb-5">
<!-- Centered Brand Logo -->
<div class="relative w-24 h-24 mb-3 flex items-center justify-center">
<div class="absolute inset-0 bg-primary-fixed/30 rounded-full blur-xl scale-110"></div>
<img alt="Limpi Logo" class="relative w-24 h-24 object-contain transition-transform duration-300 hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCd7m4nmicpLrIU-galeGXP0YYM1HQ_2VZpWnKellqBUInH7ZaETrTv9si4OSDSzirgZmQQqvM5FxtNnEPEfh0Xf8TRiTcATkMplgJohDCOd-ciVtad8LKwmEsjon5yh_7vlL-DA1Vyw6SVTLUEIsakWOzLE1H3tvQ6mmrYIdn2Urs1x_HqzFxYcFxJ3fdyUavfGCGfPE33xcpEyTQAEdwk1WeHZ6Bc-sZZ5gDB5W5HHoLlRpbT-lSVCAgSDTDAp9NxHFs"/>
</div>
<!-- Badge: UV Sanitized Service -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-container/60 text-primary font-label-sm text-label-sm mb-3">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">eco</span>
<span>Eco-Friendly Sanitizing</span>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight mb-2">
      Clean Bins. Healthy Home.
    </h1>
<p class="font-body-md text-body-md text-secondary max-w-[290px] leading-relaxed">
      Curbside bin sanitizing &amp; trash cleanup in Lehigh Acres
    </p>
</div>
<!-- Form Card with Soft Mint Surface -->
<div class="w-full bg-secondary-container/30 rounded-3xl p-5 shadow-sm">
<!-- Segmented Toggle Tabs -->
<div class="bg-surface-container-lowest p-1 rounded-2xl flex items-center justify-between mb-5 shadow-sm">
<button class="flex-1 py-2.5 px-4 rounded-xl font-label-md text-label-md transition-all duration-200 text-center bg-primary text-on-primary shadow-sm" id="tab-create" onclick="switchTab('create')" type="button">
        Create Account
      </button>
<button class="flex-1 py-2.5 px-4 rounded-xl font-label-md text-label-md transition-all duration-200 text-center text-secondary hover:text-on-surface" id="tab-signin" onclick="switchTab('signin')" type="button">
        Sign In
      </button>
</div>
<!-- Form Content -->
<form class="flex flex-col gap-3.5" id="auth-form" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-1.5" id="field-name">
<label class="font-label-sm text-label-sm text-on-surface font-semibold px-1" for="fullName">
          Full Name
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary pointer-events-none text-[20px]">
            person
          </span>
<input class="w-full h-[52px] pl-11 pr-4 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#0ba89a] transition-all" id="fullName" placeholder="Sarah Jenkins" type="text"/>
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-1.5" id="field-phone">
<label class="font-label-sm text-label-sm text-on-surface font-semibold px-1" for="phoneNumber">
          Phone Number
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary pointer-events-none text-[20px]">
            phone
          </span>
<input class="w-full h-[52px] pl-11 pr-4 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#0ba89a] transition-all" id="phoneNumber" placeholder="(239) 555-0192" type="tel"/>
</div>
</div>
<!-- Email Address Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface font-semibold px-1" for="email">
          Email Address
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary pointer-events-none text-[20px]">
            mail
          </span>
<input class="w-full h-[52px] pl-11 pr-4 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#0ba89a] transition-all" id="email" placeholder="sarah@example.com" type="email"/>
</div>
</div>
<!-- Password Field with Visibility Toggle -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between px-1">
<label class="font-label-sm text-label-sm text-on-surface font-semibold" for="password">
            Password
          </label>
<a class="hidden font-label-sm text-label-sm text-primary hover:underline" href="#" id="link-forgot">
            Forgot?
          </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary pointer-events-none text-[20px]">
            lock
          </span>
<input class="w-full h-[52px] pl-11 pr-11 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#0ba89a] transition-all" id="password" placeholder="••••••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-secondary hover:text-on-surface p-1 rounded-lg flex items-center justify-center transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action CTA -->
<button class="mt-2 w-full h-[56px] bg-primary-container text-on-primary font-label-lg text-label-lg rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-md hover:bg-primary" id="submit-btn" type="submit">
<span id="btn-label">Create Account</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Decorative Divider -->
<div class="relative flex items-center justify-center my-2">
<div class="w-full h-[1px] bg-outline-variant/40"></div>
<span class="absolute bg-surface-container-low px-3 py-0.5 rounded-full font-label-sm text-label-sm text-secondary">
          or continue with
        </span>
</div>
<!-- Social Pill Buttons -->
<div class="grid grid-cols-2 gap-3">
<!-- Apple Button -->
<button class="h-[50px] bg-surface-container-lowest hover:bg-surface-container text-on-surface rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-colors shadow-sm" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 1.01-2.87-.96.04-2.09.65-2.73 1.4-.56.64-.99 1.71-.93 2.74 1.05.08 2.07-.56 2.65-1.27z"></path>
</svg>
<span>Apple</span>
</button>
<!-- Google Button -->
<button class="h-[50px] bg-surface-container-lowest hover:bg-surface-container text-on-surface rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-colors shadow-sm" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
</div>
<!-- Mode Switch Prompt -->
<div class="text-center mt-2">
<p class="font-body-sm text-body-sm text-secondary" id="switch-text">
          Already have an account? 
          <button class="text-primary font-semibold hover:underline cursor-pointer" onclick="switchTab('signin')" type="button">
            Sign in
          </button>
</p>
</div>
</form>
</div>
<!-- Bottom Neighborhood Anchor Note -->
<div class="flex items-center justify-center gap-1.5 mt-6 text-secondary">
<span class="material-symbols-outlined text-[18px] text-primary">location_on</span>
<span class="font-label-sm text-label-sm font-semibold tracking-wide">
      Serving Lehigh Acres, FL
    </span>
</div>
</div>
<script>
  function switchTab(mode) {
    const tabCreate = document.getElementById('tab-create');
    const tabSignin = document.getElementById('tab-signin');
    const fieldName = document.getElementById('field-name');
    const fieldPhone = document.getElementById('field-phone');
    const linkForgot = document.getElementById('link-forgot');
    const btnLabel = document.getElementById('btn-label');
    const switchText = document.getElementById('switch-text');

    if (mode === 'signin') {
      // Style active Sign In tab
      tabSignin.className = "flex-1 py-2.5 px-4 rounded-xl font-label-md text-label-md transition-all duration-200 text-center bg-primary text-on-primary shadow-sm";
      tabCreate.className = "flex-1 py-2.5 px-4 rounded-xl font-label-md text-label-md transition-all duration-200 text-center text-secondary hover:text-on-surface";
      
      // Hide name & phone
      fieldName.classList.add('hidden');
      fieldPhone.classList.add('hidden');
      linkForgot.classList.remove('hidden');

      // Update CTA & footer
      btnLabel.textContent = "Sign In";
      switchText.innerHTML = 'New to Limpi? <button type="button" onclick="switchTab(\'create\')" class="text-primary font-semibold hover:underline cursor-pointer">Create Account</button>';
    } else {
      // Style active Create Account tab
      tabCreate.className = "flex-1 py-2.5 px-4 rounded-xl font-label-md text-label-md transition-all duration-200 text-center bg-primary text-on-primary shadow-sm";
      tabSignin.className = "flex-1 py-2.5 px-4 rounded-xl font-label-md text-label-md transition-all duration-200 text-center text-secondary hover:text-on-surface";
      
      // Show name & phone
      fieldName.classList.remove('hidden');
      fieldPhone.classList.remove('hidden');
      linkForgot.classList.add('hidden');

      // Update CTA & footer
      btnLabel.textContent = "Create Account";
      switchText.innerHTML = 'Already have an account? <button type="button" onclick="switchTab(\'signin\')" class="text-primary font-semibold hover:underline cursor-pointer">Sign in</button>';
    }
  }

  function togglePassword() {
    const pwdInput = document.getElementById('password');
    const pwdIcon = document.getElementById('pwd-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      pwdIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      pwdIcon.textContent = 'visibility';
    }
  }
</script></main></body></html>
